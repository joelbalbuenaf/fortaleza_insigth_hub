# Blueprint de Render: New → Blueprint → elegir este repositorio.
services:
  - type: web
    name: fortaleza-hub
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Opcional: sin key, Fide responde en modo demo. Se carga en el panel de Render (no en el repo).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Acceso al Hub: obligatorias, el servidor no arranca sin ellas. Se cargan en el panel.
      - key: HUB_USUARIO
        sync: false
      - key: HUB_CLAVE
        sync: false
      - key: HUB_SECRETO
        generateValue: true
      - key: FIDE_MODEL
        value: claude-opus-5
      - key: FIDE_EFFORT
        value: medium
